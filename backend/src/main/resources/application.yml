server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
spring:
  application:
    name: taihexing-home-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/taihexing?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:taihexing}
    password: ${DB_PASSWORD:taihexing}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
wechat:
  mini-program:
    app-id: ${WECHAT_MINI_PROGRAM_APP_ID:}
    app-secret: ${WECHAT_MINI_PROGRAM_APP_SECRET:}
  pay:
    merchant-id: ${WECHAT_PAY_MERCHANT_ID:}
    certificate-serial: ${WECHAT_PAY_CERTIFICATE_SERIAL:}
    private-key-path: ${WECHAT_PAY_PRIVATE_KEY_PATH:}
    notify-url: ${WECHAT_PAY_NOTIFY_URL:}
